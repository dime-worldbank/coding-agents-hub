name: Release AI Skills

# Fires when a push to main touches a skill folder (`skills-library/<category>/<skill-name>/`
# anywhere in the repo). Each changed skill gets its OWN release, tagged
# `<skill-name>-latest`, with a single `<skill-name>.zip` attached. The tag is
# moved and the zip replaced on every change, so this URL never changes:
#
#   https://github.com/<org>/<repo>/releases/download/<skill-name>-latest/<skill-name>.zip
#
# Run manually from the Actions tab to (re)publish every skill.

on:
  push:
    branches:
      - main
    paths:
      - "skills-library/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.find.outputs.skills }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A skill is a folder with a SKILL.md directly inside it, found anywhere under skills-library/.
      - name: Find skills to release
        id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(find skills-library -name 'SKILL.md' -print \
                | sed 's#/SKILL.md$##' | sort)

          zeros="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zeros" ]; then
            changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            todo=""
            for dir in $all; do
              if echo "$changed" | grep -q "^$dir/"; then todo="$todo$dir"$'\n'; fi
            done
          else
            todo="$all"
          fi

          echo "Skills to release:"; printf '%s' "$todo"
          json=$(printf '%s' "$todo" | python3 -c 'import sys,json; print(json.dumps([l for l in sys.stdin.read().split("\n") if l]))')
          echo "skills=$json" >> "$GITHUB_OUTPUT"

  release:
    needs: find
    if: needs.find.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill_dir: ${{ fromJson(needs.find.outputs.skills) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Name the skill, zip it, move the tag
        id: skill
        run: |
          dir="${{ matrix.skill_dir }}"
          name=$(basename "$dir")
          tag="${name}-latest"

          mkdir -p "$RUNNER_TEMP/dist"
          (cd "$(dirname "$dir")" && zip -qr "$RUNNER_TEMP/dist/$name.zip" "$name" -x '*.DS_Store')

          # Point the stable tag at this commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "${{ github.sha }}"
          git push -f origin "refs/tags/$tag"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Updates the release for an existing tag and replaces the attached zip.
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.skill.outputs.tag }}
          name: "${{ steps.skill.outputs.name }} (latest)"
          body: |
            Latest version of the `${{ steps.skill.outputs.name }}` skill, built from
            `${{ matrix.skill_dir }}` at ${{ github.sha }}.

            Download `${{ steps.skill.outputs.name }}.zip`, unzip it, and drop the
            `${{ steps.skill.outputs.name }}` folder into your project's skills
            directory (for example `.agents/skills/`).
          files: ${{ runner.temp }}/dist/${{ steps.skill.outputs.name }}.zip
          make_latest: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
